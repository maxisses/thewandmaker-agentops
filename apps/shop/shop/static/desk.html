<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The master's desk</title>
<link rel="stylesheet" href="/static/shop.css?v=3">
</head>
<body>
<header>
  <h1>The master's desk</h1><span class="sub">the wand maker decides</span>
  <div class="right"><button id="reset" title="Clear the day">New day</button></div>
</header>
<main>
  <div class="cols">
    <section class="panel"><h2>Requests for the cabinet</h2><div id="reqs"><p class="empty">Nothing waiting.</p></div></section>
    <section class="panel"><h2>Fittings reserved</h2><div id="res"><p class="empty">No fittings yet.</p></div></section>
  </div>
</main>
<script src="/static/embed.js"></script>
<script>
const seen = new Set();
// The desk key comes in the URL fragment (#key=...), never in the query, and is sent as a header.
let key = new URLSearchParams(location.hash.slice(1)).get("key");
try { if (key) sessionStorage.setItem("deskKey", key); else key = sessionStorage.getItem("deskKey"); } catch (e) {}
if (location.hash) history.replaceState(null, "", location.pathname);
const H = () => ({ "x-desk-token": key || "", "content-type": "application/json" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function decide(id, decision) {
  await fetch(`/api/desk/requests/${id}`, { method: "POST", headers: H(), body: JSON.stringify({ decision }) });
  load();
}
async function load() {
  let d;
  try {
    const r = await fetch("/api/desk", { headers: H() });
    if (r.status === 401) { document.getElementById("reqs").innerHTML = `<p class="empty">The desk is the wand maker's. Open it with /desk#key=…</p>`; return; }
    d = await r.json();
  } catch (e) { return; }
  const reqs = (d.requests || []).slice().reverse();
  document.getElementById("reqs").innerHTML = reqs.length ? reqs.map(r => `
    <div class="req ${seen.has(r.id) ? "" : "new"}">
      <div class="meta">${esc(r.id)} · ${esc(r.at)} · for ${esc(r.customer)} <span class="badge ${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="item">${esc(r.item)}</div>
      <div>${esc(r.reason)}</div>
      ${r.status === "pending" ? `<div class="actions">
        <button class="approve" onclick="decide('${esc(r.id)}','approve')">Approve</button>
        <button class="decline" onclick="decide('${esc(r.id)}','decline')">Decline</button></div>` : `<div class="meta">by ${esc(r.decided_by)}</div>`}
    </div>`).join("") : `<p class="empty">Nothing waiting.</p>`;
  const res = (d.reservations || []).slice().reverse();
  document.getElementById("res").innerHTML = res.length ? res.map(r => `
    <div class="req ${seen.has(r.id) ? "" : "new"}">
      <div class="meta">${esc(r.id)} · ${esc(r.at)} · for ${esc(r.customer)}</div>
      <div class="item">${esc(r.wand_id)}: ${esc(r.wand)}</div>
    </div>`).join("") : `<p class="empty">No fittings yet.</p>`;
  [...reqs, ...res].forEach(x => seen.add(x.id));
}
document.getElementById("reset").onclick = async () => {
  if (!confirm("Start a new day? This clears requests, fittings and conversations.")) return;
  await fetch("/api/reset", { method: "POST", headers: H() }); seen.clear(); load();
};
// The deck can decide the newest pending request: {type: "olli:decide", decision: "decline"}.
// If the digital apprentice has not filed the request yet, wait for it (up to a minute).
OlliEmbed.on("olli:decide", async (m) => {
  for (let i = 0; i < 60; i++) {
    const r = await fetch("/api/desk", { headers: H() });
    if (r.ok) {
      const pending = (await r.json()).requests.filter(x => x.status === "pending");
      if (pending.length) return decide(pending[pending.length - 1].id, m.decision === "approve" ? "approve" : "decline");
    }
    await new Promise(res => setTimeout(res, 1000));
  }
});
load(); setInterval(load, 2000);
</script>
</body>
</html>
