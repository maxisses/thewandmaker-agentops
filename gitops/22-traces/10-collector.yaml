# The scribe: an OpenTelemetry collector between the apprentice and MLflow.
# The apprentice (OpenClaw's diagnostics-otel plugin) sends OTLP spans here without any key.
# The collector adds the MLflow token, the workspace and the experiment, and passes them on to
# MLflow's OTLP endpoint (/v1/traces). Upstream collector, core distribution.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: ollivanders
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      otlphttp/mlflow:
        traces_endpoint: https://mlflow.redhat-ods-applications.svc:8443/v1/traces
        compression: none
        headers:
          Authorization: "Bearer ${env:MLFLOW_TOKEN}"
          X-MLflow-Workspace: ollivanders
          x-mlflow-experiment-id: "${env:MLFLOW_EXPERIMENT_ID}"
        tls:
          ca_file: /etc/service-ca/service-ca.crt
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/mlflow, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ollivanders
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.128.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: MLFLOW_TOKEN
              valueFrom: {secretKeyRef: {name: scribe-token, key: token}}
            - name: MLFLOW_EXPERIMENT_ID
              valueFrom: {configMapKeyRef: {name: scribe, key: experiment_id}}
          ports:
            - {containerPort: 4318, name: otlp-http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: conf, mountPath: /conf}
            - {name: ca, mountPath: /etc/service-ca}
      volumes:
        - name: conf
          configMap: {name: otel-collector}
        - name: ca
          configMap: {name: service-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ollivanders
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
