# Red Hat build of Agent Sandbox 0.9 (preview). Gives us the Sandbox CRDs and controller
# that OpenShell uses to start one pod per sandbox. Needs OpenShift 4.22.2 or newer.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: agent-sandbox-operator
  namespace: openshift-operators
spec:
  channel: preview-0.9
  name: agent-sandbox-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
