# The OpenClaw sandbox image, rebuilt on the cluster.
#
# quay.io/opendatahub/odh-openshell-sandbox-openclaw:2026.9.5 (RHEL 9.8 base, OpenClaw 2026.9.5)
# lacks the system tools the OpenShell supervisor uses to build the sandbox's network namespace
# (ip, nsenter) and refuses to start without them. We add what the upstream base sandbox has
# (as far as the UBI repos carry it) and keep everything else. The result lives in the internal
# registry:
#   image-registry.openshift-image-registry.svc:5000/olli-build/openclaw-sandbox:2026.9.5
apiVersion: v1
kind: Namespace
metadata:
  name: olli-build
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openclaw-sandbox
  namespace: olli-build
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: openclaw-sandbox
  namespace: olli-build
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      FROM quay.io/opendatahub/odh-openshell-sandbox-openclaw:2026.9.5
      USER 0
      # Required by the supervisor: ip (iproute) and nsenter (util-linux).
      RUN microdnf install -y --setopt=install_weak_deps=0 iproute util-linux \
       && for p in nftables iptables-nft procps-ng iputils bind-utils net-tools nmap-ncat openssh-server; do \
            microdnf install -y --setopt=install_weak_deps=0 $p || echo "skipped $p"; done \
       && microdnf clean all \
       && (getent group supervisor || groupadd -r supervisor) \
       && (id supervisor || useradd -r -g supervisor -s /usr/sbin/nologin supervisor)
      # OpenTelemetry export (traces for chapter 2). An external OpenClaw plugin, so it is
      # installed at build time; the sandbox has no route to the plugin registry. /sandbox only
      # exists at runtime, so the plugin goes under /usr (readable under the Landlock policy) and
      # openclaw.json loads it from there (plugins.load.paths). Pinned to the runtime's version.
      RUN HOME=/usr/local/lib/olli openclaw plugins install clawhub:@openclaw/diagnostics-otel@2026.9.5 \
       && chmod -R a+rX /usr/local/lib/olli \
       && find /usr/local/lib/olli -maxdepth 4 -not -path '*/node_modules/*' | head -40
      USER 1000
  strategy:
    type: Docker
    dockerStrategy:
      noCache: true
  output:
    to:
      kind: ImageStreamTag
      name: openclaw-sandbox:2026.9.5
  # No triggers: "make up-openclaw-image" starts the build explicitly, so a re-apply
  # never builds twice.
  triggers: []
---
# Sandbox pods run in the openshell namespace and pull from here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-can-pull
  namespace: olli-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:openshell
